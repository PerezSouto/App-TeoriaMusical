<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notas Vizinhas</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-image: url(fundo.jpg);
      background-size: cover;
      font-family: sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #target-note {
      text-align: center;
      font-size: 3em;
      margin: 20px;
      color: #333;
    }

    #balloons-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .balloon {
      position: absolute;
      width: 120px;
      height: 140px;
      cursor: pointer;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
    }

    @keyframes floatLeft {
      from {
        left: 100vw;
      }
      to {
        left: -120px;
      }
    }

    #feedback {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2em;
      padding: 10px 20px;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.8);
      color: #333;
      font-weight: bold;
      z-index: 1000;
      transition: opacity 0.3s;
    }

    .hidden {
      display: none;
    }

    #feedback.acerto {
      background-color: #c8f7c5;
      color: #2d862d;
    }

    #feedback.erro {
      background-color: #f7c5c5;
      color: #b30000;
    }

    @keyframes floatY {
  0% { transform: translateY(0); }
  25% { transform: translateY(-5px); }
  50% { transform: translateY(0); }
  75% { transform: translateY(5px); }
  100% { transform: translateY(0); }
}

  </style>
</head>
<body>
  <div id="game-container">
    <h1 id="target-note">DÓ</h1>
    <div id="balloons-container"></div>
    <div id="feedback" class="hidden">Acertou!</div>
  </div>

  <script>
    const notes = ["dó", "ré", "mi", "fá", "sol", "lá", "si"];
    let currentIndex = 0;

    // Sequência fixa sem acentos
    const sequence = ["sol", "mi", "re", "fa", "mi", "do", "la", "mi", "si", "re", "re", "sol", "do", "si", "fa", "la", "mi"];
    let sequenceIndex = 0;

    const container = document.getElementById("balloons-container");
    const targetNote = document.getElementById("target-note");
    const feedback = document.getElementById("feedback");

    // Exibição com acentos
    const displayNotes = {
      "do": "dó",
      "re": "ré",
      "mi": "mi",
      "fa": "fá",
      "sol": "sol",
      "la": "lá",
      "si": "si"
    };

    function showNewTargetNote() {
      currentIndex = Math.floor(Math.random() * notes.length);
      targetNote.textContent = notes[currentIndex].toUpperCase();
    }

    function getNextNote(index) {
      return notes[(index + 1) % notes.length];
    }

    function showFeedback(text, type) {
      feedback.textContent = text;
      feedback.classList.remove("hidden", "acerto", "erro");
      feedback.classList.add(type);

      setTimeout(() => {
        feedback.classList.add("hidden");
      }, 1500);
    }

    function spawnBalloon(note) {
      const balloon = document.createElement("div");
      balloon.className = "balloon";

      const balloonTop = Math.random() * (window.innerHeight - 140);
      balloon.style.top = `${balloonTop}px`;
      balloon.style.backgroundImage = `url('balao-${note}.png')`;

      // Cálculo da velocidade
      const distance = window.innerWidth + 120;
      const speed = 140; // pixels por segundo
      const duration = distance / speed;

      balloon.style.animation = `floatLeft ${duration}s linear forwards, floatY 2s ease-in-out infinite`;

      balloon.addEventListener("click", () => {
        const correct = getNextNote(currentIndex);
        const clickedNote = displayNotes[note];
        if (clickedNote === correct) {
          showFeedback("Acertou!", "acerto");
          showNewTargetNote();
        } else {
          showFeedback("Errou!", "erro");
        }
        balloon.remove();
      });

      container.appendChild(balloon);

      // Remove após a animação
      setTimeout(() => {
        balloon.remove();
      }, duration * 1000);
    }

    function spawnNextInSequence() {
      const note = sequence[sequenceIndex];
      spawnBalloon(note);
      sequenceIndex = (sequenceIndex + 1) % sequence.length;
    }

    showNewTargetNote();
    setInterval(spawnNextInSequence, 1500);
  </script>
</body>
</html>
